    <style>
        body {
            font-family: var(--font-base);
            background-color: var(--ink-50);
            padding: var(--space-4);
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--ink-100);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            padding: var(--space-4);
        }
        .field {
            margin-bottom: var(--space-3);
        }
        .field label {
            display: block;
            margin-bottom: var(--space-1);
            font-size: var(--fs-4);
            font-weight: 600;
        }
        .input, select {
            width: 100%;
            padding: var(--space-2);
            font-size: var(--fs-4);
            border: 1px solid var(--ink-200);
            border-radius: var(--radius-md);
            transition: border-color 0.2s;
        }
        .input:focus, select:focus {
            border-color: var(--gauss-green);
            outline: none;
        }
        .btn {
            padding: var(--space-2) var(--space-4);
            font-size: var(--fs-4);
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }
        .btn-primary {
            background-color: var(--gauss-green);
            color: var(--ink-1000);
        }
        .btn-primary:hover {
            background-color: var(--signal-grid);
        }
        .card {
            background: var(--ink-100);
            border: 1px solid var(--ink-200);
            border-radius: var(--radius-md);
            padding: var(--space-3);
            margin-bottom: var(--space-3);
        }
        .card-header {
            font-size: var(--fs-5);
            font-weight: 700;
            margin-bottom: var(--space-2);
        }
        .card-body {
            font-size: var(--fs-4);
        }
        .card-footer {
            font-size: var(--fs-4);
            font-weight: 600;
        }
    </style>
</head>
