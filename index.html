
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposta de Garantia do Fabricante</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    .form-container {
      max-width: 600px;
      margin: 0 auto;
      padding: var(--space-4);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      background-color: var(--bg-2);
    }
    .form-group {
      margin-bottom: var(--space-4);
    }
    label {
      display: block;
      margin-bottom: var(--space-2);
      color: var(--fg-1);
    }
    input, select, textarea {
      width: 100%;
      padding: var(--space-2);
      border: 1px solid var(--border-1);
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: var(--font-size-body);
      color: var(--fg-1);
      background-color: var(--bg-1);
    }
    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .btn {
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-medium);
      color: var(--fg-1);
      background-color: var(--gauss-green);
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: var(--gauss-green-dark);
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2 class="eyebrow">Proposta de Garantia do Fabricante</h2>
  <form id="warranty-form">
    <div class="form-group">
      <label for="scenario">Escolha o cenário:</label>
      <select id="scenario" name="scenario" class="select">
        <option value="garantia-gauss-e-fabricante">Garantia Gauss E Garantia Fabricante</option>
        <option value="garantia-gauss-sem-fabricante">Garantia Gauss SEM Garantia Fabricante</option>
        <option value="sem-garantia-gauss-e-fabricante">SEM Garantia Gauss e SEM Garantia Fabricante</option>
      </select>
    </div>

    <div class="form-group">
      <label for="customer-name">Nome do Cliente:</label>
      <input type="text" id="customer-name" name="customer-name" class="input" required>
    </div>

    <div class="form-group">
      <label for="city">Cidade:</label>
      <select id="city" name="city" class="select" required>
        <option value="">Selecione...</option>
        <option value="abaiera">Abaíra</option>
        <option value="abare">Abaré</option>
        <option value="acajutiba">Acajutiba</option>
        <!-- Add all the cities here -->
        <option value="petrolina">Petrolina</option>
        <option value="araripina">Araripina</option>
        <option value="ipojuca">Ipojuca</option>
        <option value="outra">Outra (escrever)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="inversor-count">Inversor(es) com Problema:</label>
      <input type="number" id="inversor-count" name="inversor-count" class="input" value="1" min="1" required>
    </div>

    <div id="inversors"></div>

    <button type="submit" class="btn">Enviar Proposta</button>
  </form>
</div>

<script>
  const inversorsContainer = document.getElementById('inversors');
  const inversorCountInput = document.getElementById('inversor-count');
  let inversorCount = parseInt(inversorCountInput.value);

  const createInversorFields = (index) => {
    const inversorDiv = document.createElement('div');
    inversorDiv.className = 'form-group';

    const acLabel = document.createElement('label');
    acLabel.htmlFor = `inversor-ac-${index}`;
    acLabel.textContent = `Potência do(s) Inversor(es) (AC) ${index}:`;

    const acInput = document.createElement('input');
    acInput.type = 'number';
    acInput.id = `inversor-ac-${index}`;
    acInput.name = `inversor-ac-${index}`;
    acInput.className = 'input';
    acInput.required = true;

    const kwLabel = document.createElement('label');
    kwLabel.htmlFor = `inversor-kw-${index}`;
    kwLabel.textContent = `Potência do Sistema (kWp) ${index}:`;

    const kwInput = document.createElement('input');
    kwInput.type = 'number';
    kwInput.id = `inversor-kw-${index}`;
    kwInput.name = `inversor-kw-${index}`;
    kwInput.className = 'input';
    kwInput.required = true;

    const brandLabel = document.createElement('label');
    brandLabel.htmlFor = `inversor-brand-${index}`;
    brandLabel.textContent = `Marca do(s) Inversor(es) ${index}:`;

    const brandInput = document.createElement('input');
    brandInput.type = 'text';
    brandInput.id = `inversor-brand-${index}`;
    brandInput.name = `inversor-brand-${index}`;
    brandInput.className = 'input';
    brandInput.required = true;

    const stockLabel = document.createElement('label');
    stockLabel.htmlFor = `inversor-stock-${index}`;
    stockLabel.textContent = `Tem em Estoque ${index}:`;

    const stockSelect = document.createElement('select');
    stockSelect.id = `inversor-stock-${index}`;
    stockSelect.name = `inversor-stock-${index}`;
    stockSelect.className = 'select';
    stockSelect.required = true;

    const stockOptionYes = document.createElement('option');
    stockOptionYes.value = 'sim';
    stockOptionYes.textContent = 'Sim';

    const stockOptionNo = document.createElement('option');
    stockOptionNo.value = 'nao';
    stockOptionNo.textContent = 'Não';

    stockSelect.appendChild(stockOptionYes);
    stockSelect.appendChild(stockOptionNo);

    inversorDiv.appendChild(acLabel);
    inversorDiv.appendChild(acInput);
    inversorDiv.appendChild(kwLabel);
    inversorDiv.appendChild(kwInput);
    inversorDiv.appendChild(brandLabel);
    inversorDiv.appendChild(brandInput);
    inversorDiv.appendChild(stockLabel);
    inversorDiv.appendChild(stockSelect);

    stockSelect.addEventListener('change', () => {
      if (stockSelect.value === 'nao') {
        const replacementBrandLabel = document.createElement('label');
        replacementBrandLabel.htmlFor = `inversor-replacement-brand-${index}`;
        replacementBrandLabel.textContent = `Marca do Inversor a ser Substituído:`;

        const replacementBrandInput = document.createElement('input');
        replacementBrandInput.type = 'text';
        replacementBrandInput.id = `inversor-replacement-brand-${index}`;
        replacementBrandInput.name = `inversor-replacement-brand-${index}`;
        replacementBrandInput.className = 'input';
        replacementBrandInput.required = true;

        const replacementPotenciaLabel = document.createElement('label');
        replacementPotenciaLabel.htmlFor = `inversor-replacement-potencia-${index}`;
        replacementPotenciaLabel.textContent = `Potência do Inversor a ser Substituído:`;

        const replacementPotenciaInput = document.createElement('input');
        replacementPotenciaInput.type = 'number';
        replacementPotenciaInput.id = `inversor-replacement-potencia-${index}`;
        replacementPotenciaInput.name = `inversor-replacement-potencia-${index}`;
        replacementPotenciaInput.className = 'input';
        replacementPotenciaInput.required = true;

        const replacementValorLabel = document.createElement('label');
        replacementValorLabel.htmlFor = `inversor-replacement-valor-${index}`;
        replacementValorLabel.textContent = `Valor do Inversor a ser Substituído:`;

        const replacementValorInput = document.createElement('input');
        replacementValorInput.type = 'number';
        replacementValorInput.id = `inversor-replacement-valor-${index}`;
        replacementValorInput.name = `inversor-replacement-valor-${index}`;
        replacementValorInput.className = 'input';
        replacementValorInput.required = true;

        inversorDiv.appendChild(replacementBrandLabel);
        inversorDiv.appendChild(replacementBrandInput);
        inversorDiv.appendChild(replacementPotenciaLabel);
        inversorDiv.appendChild(replacementPotenciaInput);
        inversorDiv.appendChild(replacementValorLabel);
        inversorDiv.appendChild(replacementValorInput);
      } else {
        const replacementFields = inversorDiv.querySelectorAll('label, input');
        replacementFields.forEach(field => field.remove());
      }
    });

    return inversorDiv;
  };

  const updateInversors = () => {
    inversorsContainer.innerHTML = '';
    inversorCount = parseInt(inversorCountInput.value);
    for (let i = 1; i <= inversorCount; i++) {
      const inversorFields = createInversorFields(i);
      inversorsContainer.appendChild(inversorFields);
    }
  };

  inversorCountInput.addEventListener('input', updateInversors);
  updateInversors();
</script>

</body>
</html>
