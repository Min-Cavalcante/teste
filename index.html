<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposta de Garantia do Fabricante</title>
    <link rel="stylesheet" href="colors_and_type.css">
    <style>
        body {
            margin: 0;
            padding: 56px;
            background: var(--bg-paper);
            font-family: var(--font-body);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px;
            background: white;
            border: 1px solid var(--border-hairline);
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--fg-2);
        }
        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 6px;
            border: 1px solid var(--ink-300);
            background: white;
            transition: all .15s;
            font-family: var(--font-body);
            font-size: 15px;
        }
        select:focus, input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--gauss-green);
            box-shadow: 0 0 0 3px rgba(57,181,74,0.18);
        }
        .inversor-group {
            margin-top: 20px;
        }
        .substituto-group {
            margin-top: 10px;
            display: none;
        }
        button[type="submit"] {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 15px;
            padding: 12px 20px;
            border-radius: 4px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all .15s ease;
            text-decoration: none;
            letter-spacing: -0.005em;
            background: var(--gauss-green);
            color: var(--ink-1000);
            box-shadow: var(--shadow-sm);
        }
        button[type="submit"]:hover {
            background: var(--gauss-green-700);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-family: var(--font-display); font-weight: 800; font-size: 56px; letter-spacing: -0.03em; margin-bottom: 32px;">Proposta de Garantia do Fabricante</h1>
        <form id="garantiaForm">
            <div class="form-group">
                <label for="cenario">Escolha o cenário:</label>
                <select id="cenario" name="cenario" class="input">
                    <option value="Garantia Gauss E Garantia Fabricante">Garantia Gauss E Garantia Fabricante</option>
                    <option value="Garantia Gauss SEM Garantia Fabricante">Garantia Gauss SEM Garantia Fabricante</option>
                    <option value="SEM Garantia Gauss e SEM Garantia Fabricante">SEM Garantia Gauss e SEM Garantia Fabricante</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nomeCliente">Nome do Cliente:</label>
                <input type="text" id="nomeCliente" name="nomeCliente" required class="input">
            </div>

            <div class="form-group">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required class="input">
            </div>

            <div class="form-group">
                <label for="inversores">Inversor(es) com Problema:</label>
                <input type="number" id="inversores" name="inversores" value="1" min="1" required class="input">
            </div>

            <div id="inversores-container" class="inversor-group">
                <!-- Inversores will be added here -->
            </div>

            <button type="submit" class="btn btn-primary">Enviar <span class="arrow">→</span></button>
        </form>
    </div>

    <script>
        document.getElementById('inversores').addEventListener('input', function() {
            updateInversorFields();
        });

        document.getElementById('garantiaForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const formData = new FormData(this);
            const data = {};

            formData.forEach((value, key) => {
                if (data[key]) {
                    if (!Array.isArray(data[key])) {
                        data[key] = [data[key]];
                    }
                    data[key].push(value);
                } else {
                    data[key] = value;
                }
            });

            fetch('https://your-webhook-url', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                console.log('Success:', data);
                alert('Formulário enviado!');
            })
            .catch((error) => {
                console.error('Error:', error);
                alert('Erro ao enviar o formulário.');
            });
        });

        function updateInversorFields() {
            const inversorCount = document.getElementById('inversores').value;
            const inversorContainer = document.getElementById('inversores-container');
            inversorContainer.innerHTML = '';

            for (let i = 1; i <= inversorCount; i++) {
                inversorContainer.innerHTML += `
                    <div>
                        <h3 style="font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; margin-bottom: 16px;">Inversor ${i}</h3>
                        <div class="form-group">
                            <label for="potenciaAc${i}">Potência do(s) Inversor(es) (AC):</label>
                            <input type="number" id="potenciaAc${i}" name="potenciaAc${i}" required class="input">
                        </div>
                        <div class="form-group">
                            <label for="potenciaSistema${i}">Potência do Sistema (kWp):</label>
                            <input type="number" id="potenciaSistema${i}" name="potenciaSistema${i}" required class="input">
                        </div>
                        <div class="form-group">
                            <label for="marcaInversor${i}">Marca do(s) Inversor(es):</label>
                            <input type="text" id="marcaInversor${i}" name="marcaInversor${i}" required class="input">
                        </div>
                        <div class="form-group">
                            <label for="temEmEstoque${i}">Tem em Estoque:</label>
                            <select id="temEmEstoque${i}" name="temEmEstoque${i}" required class="input">
                                <option value="Sim">Sim</option>
                                <option value="Não">Não</option>
                            </select>
                        </div>
                        <div id="substitutoGroup${i}" class="substituto-group">
                            <div class="form-group">
                                <label for="marcaSubstituto${i}">Marca do Inversor a ser Substituído:</label>
                                <input type="text" id="marcaSubstituto${i}" name="marcaSubstituto${i}" class="input">
                            </div>
                            <div class="form-group">
                                <label for="potenciaSubstituto${i}">Potência do Inversor a ser Substituído:</label>
                                <input type="number" id="potenciaSubstituto${i}" name="potenciaSubstituto${i}" class="input">
                            </div>
                            <div class="form-group">
                                <label for="valorSubstituto${i}">Valor do Inversor a ser Substituído:</label>
                                <input type="number" id="valorSubstituto${i}" name="valorSubstituto${i}" class="input">
                            </div>
                        </div>
                    </div>
                `;

                const temEmEstoque = document.getElementById(`temEmEstoque${i}`);
                const substitutoGroup = document.getElementById(`substitutoGroup${i}`);
                temEmEstoque.addEventListener('change', function() {
                    if (this.value === 'Não') {
                        substitutoGroup.style.display = 'block';
                    } else {
                        substitutoGroup.style.display = 'none';
                    }
                });

                // Initialize visibility for the first inversor
                if (i === 1 && temEmEstoque.value === 'Não') {
                    substitutoGroup.style.display = 'block';
                }
            }
        }

        // Initialize with 1 inversor by default
        updateInversorFields();
    </script>
</body>
</html>
